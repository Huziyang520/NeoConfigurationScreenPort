plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
}

subprojects {
    apply plugin: 'java'

    group = mod_group
    version = mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    repositories {
        // 国内镜像放在官方源之前
        maven { name = 'Aliyun Central'; url = 'https://maven.aliyun.com/repository/central' }
        maven { name = 'Aliyun Public'; url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    }

    // 产物名 <mod_id>-<version>-<loader>-<MC>
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveBaseName = "${mod_id}-${mod_version}-${project.name}-${minecraft_version}"
        archiveVersion = ''
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    // 许可证随产物分发；manifest 版本供 mods.toml 的 ${file.jarVersion} 读取
    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                    'Implementation-Title': mod_name,
                    'Implementation-Version': project.version
            )
        }
    }

    tasks.named('jar') {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('LICENSE-LGPL-2.1.md'))
        from(rootProject.file('LICENSING.md'))
    }
}
