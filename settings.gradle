pluginManagement {
    repositories {
        maven {
            name = 'Aliyun Gradle Plugin Portal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'ConfigurationScreenPort'
include 'forge', 'fabric'
