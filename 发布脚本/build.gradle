// Standalone build: run from the repository root with
//   ./gradlew -p 发布脚本 <task>
// Credentials are never passed on the command line; the tasks read them from the user level
// Gradle properties (curseforge_api_key / githubToken) or the GITHUB_TOKEN environment variable.

import java.net.InetSocketAddress
import java.net.ProxySelector
import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.Path
import java.security.MessageDigest
import java.time.Duration

// ---------------------------------------------------------------- project facts

def repoRoot = projectDir.parentFile
def props = new Properties()
new File(repoRoot, 'gradle.properties').withInputStream { props.load(it) }
def modVersion = props.getProperty('mod_version')
def modName = props.getProperty('mod_name')
def cfProjectId = (findProperty('cfProjectId') ?: '1800581').toString()
def githubRepo = (findProperty('githubRepo') ?: 'Huziyang520/NeoConfigurationScreenPort').toString()
def releaseType = (findProperty('releaseType') ?: 'beta').toString()
def prerelease = (findProperty('prerelease') ?: 'false').toString().toBoolean()
def proxyEnabled = (findProperty('proxy') ?: 'true').toString().toBoolean()
def proxyHost = (findProperty('proxyHost') ?: '127.0.0.1').toString()
def proxyPort = Integer.parseInt((findProperty('proxyPort') ?: '7897').toString())

def cfKey = findProperty('curseforge_api_key')

/** Last resort for the GitHub token: the credential git already stored for github.com. Never printed. */
def storedGithubToken = {
    try {
        def process = new ProcessBuilder('git', 'credential', 'fill')
                .redirectErrorStream(true)
                .start()
        process.outputStream.withWriter('UTF-8') { writer ->
            writer.write("protocol=https\nhost=github.com\n\n")
        }
        process.waitFor()
        def text = process.inputStream.getText('UTF-8')
        def found = (text =~ /(?m)^password=(.+)$/)
        found.find() ? found.group(1).trim() : null
    } catch (Exception ignored) {
        null
    }
}

def ghToken = findProperty('githubToken') ?: findProperty('github_token') ?: System.getenv('GITHUB_TOKEN') ?: storedGithubToken()

/** The single release artifact: the Forge jar of the current version, never a sources/jarJar file. */
def releaseJar = {
    def jars = fileTree(new File(repoRoot, 'forge/build/libs')) {
        include "*-${modVersion}-forge-*.jar"
        exclude '**/*-sources.jar'
        exclude '**/*-javadoc.jar'
    }.files.sort { it.name }
    if (jars.size() != 1) {
        throw new GradleException("expected exactly one forge jar for ${modVersion}, found ${jars*.name}")
    }
    jars[0]
}

def changelog = {
    def file = new File(projectDir, "changelogs/${modVersion}.md")
    file.exists() ? file.getText('UTF-8') : "Version ${modVersion}."
}

def sha256 = { Path path ->
    def digest = MessageDigest.getInstance('SHA-256')
    digest.update(Files.readAllBytes(path))
    digest.digest().collect { String.format('%02x', it) }.join()
}

def httpClient = {
    def builder = HttpClient.newBuilder()
            .connectTimeout(Duration.ofSeconds(30))
            .followRedirects(HttpClient.Redirect.NORMAL)
    if (proxyEnabled) {
        builder.proxy(ProxySelector.of(new InetSocketAddress(proxyHost, proxyPort)))
    }
    builder.build()
}

// ---------------------------------------------------------------- tasks

tasks.register('verify') {
    description = 'Checks that the release jar exists, matches gradle.properties and is the only one.'
    doLast {
        def jar = releaseJar()
        def expected = "neoconfigurationscreenport-${modVersion}-forge-1.20.1.jar"
        if (jar.name != expected) {
            throw new GradleException("jar name ${jar.name} does not match ${expected}")
        }
        println "version : ${modVersion}"
        println "jar     : ${jar.absolutePath}"
        println "size    : ${jar.length()} bytes"
        println "sha256  : ${sha256(jar.toPath())}"
        println "cf key  : ${cfKey != null ? 'found' : 'MISSING'}"
        println "gh token: ${ghToken != null ? 'found' : 'MISSING'}"
        println "proxy   : ${proxyEnabled ? "${proxyHost}:${proxyPort}" : 'disabled'}"
    }
}

tasks.register('cfUpload') {
    description = 'Uploads the release jar to CurseForge (legacy endpoint, explicit proxy).'
    dependsOn 'verify'
    doLast {
        if (cfKey == null) {
            throw new GradleException('curseforge_api_key is not set in the user level gradle.properties')
        }
        def client = httpClient()
        def apiBase = 'https://minecraft.curseforge.com'

        // CurseForge wants numeric game version ids, and some names exist twice (mc version vs loader).
        def versionsRequest = HttpRequest.newBuilder(URI.create("${apiBase}/api/game/versions"))
                .header('X-Api-Token', cfKey.toString())
                .timeout(Duration.ofSeconds(60))
                .GET().build()
        def versionsResponse = client.send(versionsRequest, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        if (versionsResponse.statusCode() != 200) {
            throw new GradleException("GET /api/game/versions failed: ${versionsResponse.statusCode()}")
        }
        def allVersions = new groovy.json.JsonSlurper().parseText(versionsResponse.body())

        def typesRequest = HttpRequest.newBuilder(URI.create("${apiBase}/api/game/version-types"))
                .header('X-Api-Token', cfKey.toString())
                .timeout(Duration.ofSeconds(60))
                .GET().build()
        def typeNames = [:]
        def typesResponse = client.send(typesRequest, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        if (typesResponse.statusCode() == 200) {
            new groovy.json.JsonSlurper().parseText(typesResponse.body()).each { typeNames[it.id] = it.name?.toString() }
        }

        def wanted = ((findProperty('cfGameVersions') ?: '1.20.1,Forge,Client').toString()).split(',')*.trim().findAll { it }
        def ids = []
        def missing = []
        wanted.each { name ->
            def candidates = allVersions.findAll { it.name != null && it.name.toString() == name }
            if (candidates.isEmpty()) {
                missing << name
                return
            }
            def pick = candidates.find { typeNames[it.gameVersionTypeID] == name }
                    ?: candidates.find { (typeNames[it.gameVersionTypeID] ?: '').toLowerCase().contains('loader') }
                    ?: candidates.find { (typeNames[it.gameVersionTypeID] ?: '') == 'Environment' }
                    ?: candidates[0]
            if (candidates.size() > 1) {
                println "'${name}' matched ${candidates.size()} entries, using ${pick.id} (${typeNames[pick.gameVersionTypeID] ?: '?'})"
            }
            ids << (pick.id as int)
        }
        if (missing) {
            throw new GradleException("unknown curseforge game versions: ${missing}")
        }
        println "game version ids: ${ids}"

        def metadata = groovy.json.JsonOutput.toJson([
                changelog    : changelog(),
                changelogType: 'markdown',
                displayName  : "${modName} ${modVersion}",
                releaseType  : releaseType,
                gameVersions : ids,
        ])

        def jar = releaseJar()
        def boundary = '----port' + System.currentTimeMillis()
        def nl = '\r\n'
        def head = new StringBuilder()
        head << "--${boundary}${nl}"
        head << 'Content-Disposition: form-data; name="metadata"' << nl << nl
        head << metadata << nl
        head << "--${boundary}${nl}"
        head << 'Content-Disposition: form-data; name="file"; filename="' << jar.name << '"' << nl
        head << 'Content-Type: application/java-archive' << nl << nl
        def tail = "${nl}--${boundary}--${nl}"

        def body = new ByteArrayOutputStream()
        body.write(head.toString().getBytes(StandardCharsets.UTF_8))
        body.write(Files.readAllBytes(jar.toPath()))
        body.write(tail.getBytes(StandardCharsets.UTF_8))

        println "uploading ${jar.name} to project ${cfProjectId} (${releaseType})"
        def request = HttpRequest.newBuilder(URI.create("${apiBase}/api/projects/${cfProjectId}/upload-file"))
                .timeout(Duration.ofMinutes(10))
                .header('X-Api-Token', cfKey.toString())
                .header('Content-Type', "multipart/form-data; boundary=${boundary}")
                .POST(HttpRequest.BodyPublishers.ofByteArray(body.toByteArray()))
                .build()
        def response = client.send(request, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        println "curseforge status: ${response.statusCode()}"
        if (response.statusCode() != 200) {
            throw new GradleException("curseforge upload failed: ${response.body()}")
        }
        def parsed = new groovy.json.JsonSlurper().parseText(response.body())
        if (parsed.id == null) {
            throw new GradleException("curseforge response has no file id: ${response.body()}")
        }
        println "curseforge file id: ${parsed.id}"
    }
}

tasks.register('cfFiles') {
    description = 'Lists the uploaded CurseForge files of this project (read-only, for verification).'
    doLast {
        if (cfKey == null) {
            throw new GradleException('curseforge_api_key is not set in the user level gradle.properties')
        }
        def client = httpClient()
        def apiBase = 'https://minecraft.curseforge.com'
        def names = [:]
        def versionsResponse = client.send(
                HttpRequest.newBuilder(URI.create("${apiBase}/api/game/versions"))
                        .header('X-Api-Token', cfKey.toString()).timeout(Duration.ofSeconds(60)).GET().build(),
                HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        if (versionsResponse.statusCode() == 200) {
            new groovy.json.JsonSlurper().parseText(versionsResponse.body()).each { names[it.id] = it.name?.toString() }
        }
        def response = client.send(
                HttpRequest.newBuilder(URI.create("${apiBase}/api/projects/${cfProjectId}/files"))
                        .header('X-Api-Token', cfKey.toString()).timeout(Duration.ofSeconds(60)).GET().build(),
                HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        if (response.statusCode() != 200) {
            throw new GradleException("GET /api/projects/${cfProjectId}/files failed: ${response.statusCode()}")
        }
        new groovy.json.JsonSlurper().parseText(response.body()).each { file ->
            println "file ${file.id} | ${file.displayName} | ${file.releaseType} | ${file.fileName} | ${file.gameVersions?.collect { names[it] ?: it }}"
        }
    }
}

tasks.register('ghRelease') {
    description = 'Creates the GitHub release for this version and attaches the release jar.'
    dependsOn 'verify'
    doLast {
        if (ghToken == null) {
            throw new GradleException('githubToken is missing (user level gradle.properties or GITHUB_TOKEN)')
        }
        def tag = "v${modVersion}"
        def client = httpClient()
        def auth = "Bearer ${ghToken}"
        def api = 'https://api.github.com'

        def existing = client.send(
                HttpRequest.newBuilder(URI.create("${api}/repos/${githubRepo}/releases/tags/${tag}"))
                        .header('Authorization', auth)
                        .header('Accept', 'application/vnd.github+json')
                        .timeout(Duration.ofSeconds(60))
                        .GET().build(),
                HttpResponse.BodyHandlers.ofString())
        if (existing.statusCode() == 200) {
            throw new GradleException("release ${tag} already exists; bump the version or edit it by hand")
        }

        def payload = groovy.json.JsonOutput.toJson([
                tag_name              : tag,
                target_commitish      : (findProperty('targetCommitish') ?: 'main').toString(),
                name                  : "${modName} ${modVersion}",
                body                  : changelog(),
                draft                 : false,
                prerelease            : prerelease,
        ])
        def created = client.send(
                HttpRequest.newBuilder(URI.create("${api}/repos/${githubRepo}/releases"))
                        .header('Authorization', auth)
                        .header('Accept', 'application/vnd.github+json')
                        .header('Content-Type', 'application/json')
                        .timeout(Duration.ofSeconds(120))
                        .POST(HttpRequest.BodyPublishers.ofString(payload, StandardCharsets.UTF_8))
                        .build(),
                HttpResponse.BodyHandlers.ofString())
        println "release status: ${created.statusCode()}"
        if (created.statusCode() != 201) {
            throw new GradleException("release creation failed: ${created.body()}")
        }
        def releaseId = new groovy.json.JsonSlurper().parseText(created.body()).id

        def jar = releaseJar()
        def uploaded = client.send(
                HttpRequest.newBuilder(URI.create("https://uploads.github.com/repos/${githubRepo}/releases/${releaseId}/assets?name=${URLEncoder.encode(jar.name, 'UTF-8')}"))
                        .header('Authorization', auth)
                        .header('Accept', 'application/vnd.github+json')
                        .header('Content-Type', 'application/java-archive')
                        .timeout(Duration.ofMinutes(10))
                        .POST(HttpRequest.BodyPublishers.ofFile(jar.toPath()))
                        .build(),
                HttpResponse.BodyHandlers.ofString())
        println "asset status: ${uploaded.statusCode()}"
        if (uploaded.statusCode() != 201) {
            throw new GradleException("asset upload failed: ${uploaded.body()}")
        }
        def asset = new groovy.json.JsonSlurper().parseText(uploaded.body())
        println "release: https://github.com/${githubRepo}/releases/tag/${tag}"
        println "asset  : ${asset.name} (${asset.size} bytes)"
    }
}

tasks.register('ghShow') {
    description = 'Prints the release of the current version and its assets (read-only, for verification).'
    doLast {
        if (ghToken == null) {
            throw new GradleException('githubToken is missing')
        }
        def tag = "v${modVersion}"
        def client = httpClient()
        def response = client.send(
                HttpRequest.newBuilder(URI.create("https://api.github.com/repos/${githubRepo}/releases/tags/${tag}"))
                        .header('Authorization', "Bearer ${ghToken}")
                        .header('Accept', 'application/vnd.github+json')
                        .timeout(Duration.ofSeconds(60))
                        .GET().build(),
                HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
        if (response.statusCode() != 200) {
            throw new GradleException("GET release ${tag} failed: ${response.statusCode()}")
        }
        def release = new groovy.json.JsonSlurper().parseText(response.body())
        println "tag        : ${release.tag_name}"
        println "name       : ${release.name}"
        println "prerelease : ${release.prerelease}"
        println "draft      : ${release.draft}"
        println "url        : ${release.html_url}"
        println "assets     : ${release.assets.size()}"
        release.assets.each { println "  ${it.name} (${it.size} bytes) state=${it.state}" }
    }
}
