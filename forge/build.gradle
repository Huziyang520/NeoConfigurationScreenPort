plugins {
    id 'net.minecraftforge.gradle'
}

// 屏幕核心与两个加载器共用同一份源码，各自编译各自的 jar
sourceSets.main.java.srcDirs += ['../common/src/main/java']
sourceSets.main.resources.srcDirs += ['../common/src/main/resources']

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

jar {
    finalizedBy 'reobfJar'
}

// Userdev resolves Minecraft under official names; the reobfuscated release jar only links in a
// production runtime. This jar is the one to put on a development classpath, never into mods/.
tasks.register('devJar', Jar) {
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    from sourceSets.main.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('LICENSE-LGPL-2.1.md'))
    from(rootProject.file('LICENSING.md'))
}

tasks.named('assemble') {
    dependsOn tasks.named('devJar')
}
